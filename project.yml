name: OnAir
options:
  bundleIdPrefix: at.teibler
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  swift-mqtt:
    url: https://github.com/emqx/swift-mqtt
    from: "1.5.2"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: V8583J8736

targets:
  OnAir:
    type: application
    platform: macOS
    sources:
      - path: OnAir
    dependencies:
      - package: swift-mqtt
        product: MQTT
    settings:
      base:
        INFOPLIST_FILE: OnAir/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: at.teibler.OnAir
        PRODUCT_NAME: OnAir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    preBuildScripts:
      - path: Scripts/bump-version.sh
        name: "Bump version (+0.1)"
        basedOnDependencyAnalysis: false
